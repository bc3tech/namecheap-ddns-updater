# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: namecheap-ddns-updater
metadata:
    template: azd-init@1.31.2
hooks:
    postprovision:
        windows:
            shell: pwsh
            interactive: false
            continueOnError: false
            run: scripts/configure-container-app-scaling.ps1
        posix:
            shell: sh
            interactive: false
            continueOnError: false
            run: scripts/configure-container-app-scaling.sh
    postdeploy:
        windows:
            shell: pwsh
            interactive: false
            continueOnError: false
            run: scripts/configure-container-app-scaling.ps1
        posix:
            shell: sh
            interactive: false
            continueOnError: false
            run: scripts/configure-container-app-scaling.sh
services:
    namecheap-ddns-updater:
        project: .
        host: containerapp
        language: python
        docker:
            path: Dockerfile
            platform: linux/amd64
resources:
    namecheap-ddns-updater:
        type: host.containerapp
        port: 80
